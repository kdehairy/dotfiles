[ssh.files]
"ssh/config" = "~/.ssh/config"
"ssh/gpg_config" = "~/.ssh/gpg_config"
"ssh/my_config" = "~/.ssh/my_config"

[zsh]
depends = ["os"]

[zsh.variables]
usingZimComp = true

[zsh.files]
"zsh/.zshrc" = "~/.zshrc"
"zsh/.zshenv" = "~/.zshenv"

[zim]
depends = ["zsh"]

[zim.files]
"zim/config" = { target = "~/.zim", type = "symbolic" }
"zim/.zimrc" = { target = "~/.zimrc", type = "symbolic" }


[tmux.files]
"tmux/.tmux.conf" = "~/.tmux.conf"

[foot.files]
"foot/foot.ini" = "~/.config/foot/foot.ini"
"foot/theme/tokyonight" = "~/.local/share/foot/themes/tokyonight"

[foot.variables]
versionPre1_17 = false

[sway.files]
"sway/config" = "~/.config/sway/config"
"sway/bkgrnd.jpg" = {target = "~/.local/share/backgrounds/sway/bkgrnd.jpg", type = "symbolic"}

[kickoff]
depends = ["sway"]

[kickoff.files]
"kickoff/config.toml" = "~/.config/kickoff/config.toml"

[waybar]
depends = ["sway"]

[waybar.files]
"waybar/config"  = "~/.config/waybar/config"
"waybar/style.css" = "~/.config/waybar/style.css"

[nvim.files]
"nvim/init.lua" = "~/.config/nvim/init.lua"
"nvim/filetype.lua" = "~/.config/nvim/filetype.lua"
"nvim/lua/" = "~/.config/nvim/lua/"

[nvim.variables]
nvim-go = false
nvim-tf = false

[git.files]
"git/.gitconfig" = "~/.gitconfig"

[gnupg.files]
"gnupg/gpg-agent.conf" = "~/.gnupg/gpg-agent.conf"
"gnupg/gpg.conf" = "~/.gnupg/gpg.conf"
"gnupg/scdaemon.conf" = "~/.gnupg/scdaemon.conf"
"gnupg/sshcontrol" = "~/.gnupg/sshcontrol"

[os.variables]
isArch = true
